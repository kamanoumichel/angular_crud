<div class="row">
  <div class="col-8">
    <div class="card">
      <div class="card-header bg-success">
        <h6>Employee List</h6>
      </div>
      <div class="card-body">
        <div class="row">
          <div class="col-12">
            <table class="table table-bordered">
              <thead>
                <tr>
                  <th>Sr No</th>
                  <th>Name</th>
                  <th>Contact No</th>
                  <th>Email</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody>
                @for (i of employeeList; track $index) {
                  <tr>
                    <td>{{$index+1}}</td>
                    <td>{{i.name}}</td>
                    <td>{{i.contactNo}}</td>
                    <td>{{i.emailId}}</td>
                    <td class="text-center">
                      <button class="btn btn-primary" (click)="onEdit(i)">Edit</button>
                      <button class="btn btn-danger mx-2" (click)="onDelete(i.empId)">Delete</button>
                    </td>
                  </tr>
                }

              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
  <form [formGroup]="employeeFrom">
      <div class="col-4">
        <div class="Card">
          <div class="card-header bg-success">
            New Employee
          </div>
          <div class="card-body">
            <div class="row">
              <div class="col-6">
                <label for="">Name</label>
                <input type="text" class="form-control" formControlName="name">
              </div>
              <div class="col-6">
                <label for="">Email-Id</label>
                <input type="text" class="form-control" formControlName="emailId">
              </div>
              <div class="col-6">
                <label for="">Contact No</label>
                <input type="text" class="form-control" formControlName="contactNo">
              </div>
              <div class="col-6">
                <label for="">City</label>
                <input type="text" class="form-control" formControlName="city">
              </div>
              <div class="col-6">
                <label for="">State</label>
                <input type="text" class="form-control" formControlName="state">
              </div>
              <div class="col-6">
                <label for="">Adress</label>
                <textarea name="" class="form-control" formControlName="address"></textarea>
              </div>
            </div>
            <div class="row pt-2">
              <div class="col-6 text-center">
                <button class="btn btn-secondary" type="reset">Reset</button>
              </div>
              <div class="col-6 text-center">
                @if(employeeFrom.controls['empId'].value==1){
                  <button class="btn btn-success" (click)="onSave()">Save</button>
                }
                @else{
                  <button class="btn btn-warning" (click)="onUpdate()">Update</button>
                }
                
              </div>
            </div>
          </div>
        </div>
      </div>
  </form>
</div>
